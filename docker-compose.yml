version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: arenahub-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-arenahub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arenahub-api
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-arenahub}?schema=public
      JWT_SECRET: ${JWT_SECRET:-arenahub-super-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
